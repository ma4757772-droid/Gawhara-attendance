main{position:relative;z-index:1;max-width:1000px;margin:auto;padding:18px 16px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.top img{width:46px;height:42px;object-fit:contain}
.top b{font-size:19px;font-weight:800}.top b i{color:var(--g);font-style:normal}
.top small{display:block;color:var(--m);font-size:12px}.sp{flex:1}
.card{background:var(--c);border:1px solid var(--l);border-radius:20px;padding:18px;backdrop-filter:blur(8px);margin-bottom:14px}
.hero{text-align:center;padding:30px 10px 10px}.hero h1{font-size:30px;margin:0 0 6px;font-weight:800}.hero h1 i{color:var(--g);font-style:normal}.hero p{color:var(--m);margin:0 0 26px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.big{cursor:pointer;text-align:center;padding:34px 18px;transition:.2s;border-color:rgba(253,200,7,.25)}.big:hover{transform:translateY(-3px);border-color:var(--g);box-shadow:0 10px 40px rgba(253,200,7,.12)}
.big h2{margin:10px 0 4px;font-size:21px}.big p{margin:0;color:var(--m);font-size:14px}.ic{font-size:40px;color:var(--g)}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 18px;cursor:pointer;background:var(--g);color:#111;text-decoration:none;display:inline-block}
button.s,.btn.s{background:rgba(255,255,255,.08);color:var(--t)}button.d{background:rgba(248,113,113,.15);color:var(--bad)}button.sm{padding:6px 12px;font-size:13px;border-radius:10px}
button:disabled{opacity:.5}
input,select{font:inherit;width:100%;background:#111113;border:1px solid var(--l);color:var(--t);border-radius:12px;padding:11px 12px;outline:none}input:focus,select:focus{border-color:var(--g)}
label{font-size:13px;color:var(--m);display:block;margin-bottom:5px}.f{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));align-items:end}
.cam{position:relative;aspect-ratio:4/3;max-width:420px;margin:0 auto 16px;border-radius:26px;overflow:hidden;background:#000;border:2px solid rgba(253,200,7,.5)}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam:after{content:"";position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--g),transparent);box-shadow:0 0 18px var(--g);animation:sc 2.4s ease-in-out infinite}
@keyframes sc{0%,100%{top:4%}50%{top:94%}}
.cam .nc{position:absolute;inset:0;display:grid;place-items:center;color:var(--m);text-align:center;padding:20px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:420px;margin:auto}.two button{padding:16px;font-size:16px}
.out{background:#27272a;color:var(--t)}
.res{text-align:center;padding:10px}.res h2{font-size:26px;margin:6px 0}.res .ic{font-size:54px;color:var(--ok)}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tabs button{background:rgba(255,255,255,.07);color:var(--t);white-space:nowrap}.tabs button.on{background:var(--g);color:#111}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}.stat{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:14px}.stat b{font-size:28px;color:var(--g);display:block}.stat span{color:var(--m);font-size:13px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}th{color:var(--m);font-weight:600;font-size:13px;text-align:right}th,td{padding:10px 8px;border-bottom:1px solid var(--l);font-size:14px;vertical-align:middle}
.b{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}.b.in{background:rgba(52,211,153,.15);color:var(--ok)}.b.o{background:rgba(255,255,255,.08);color:var(--m)}.b.w{background:rgba(248,113,113,.15);color:var(--bad)}
a{color:var(--g)}img.th{width:40px;height:30px;object-fit:cover;border-radius:6px;vertical-align:middle}.mut{color:var(--m);font-size:13px}.err{color:var(--bad)}
</style></head><body><div class="wm"></div><main id="app"></main>

const startOf=k=>{const d=new Date();d.setHours(0,0,0,0);if(k=='week')d.setDate(d.getDate()-((d.getDay()+1)%7));if(k=='month')d.setDate(1);return +d};

 $('#app').innerHTML=head(1)+`<div class="tabs">${T.map(t=>`<button class="${tab==t[0]?'on':''}" data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</div><div id="tb"></div>`;({today:tToday,workers:tWorkers,reports:tReports,set:tSet})[tab]()}
function tToday(){const s=startOf('day'),L=D.logs.filter(l=>l.t>=s).sort((a,b)=>b.t-a.t);const rows=D.workers.map(w=>{const ls=L.filter(l=>l.wid==w.id),last=ls[0],first=ls.filter(l=>l.type=='in').pop();return{w,last,first,h:hrs(w.id,s)}});const now=rows.filter(r=>r.last&&r.last.type=='in').length,out=rows.filter(r=>r.last&&away(r.last)).length;
 $('#tb').innerHTML=`<div class="stats"><div class="stat"><b>${D.workers.length}</b><span>إجمالي العمال</span></div><div class="stat"><b>${now}</b><span>داخل الآن</span></div><div class="stat"><b>${rows.filter(r=>r.last).length}</b><span>سجّلوا اليوم</span></div><div class="stat"><b>${out}</b><span>خارج النطاق</span></div></div><div class="card tw"><p class="mut" style="margin-top:0">${dd(Date.now())}</p><table><tr><th>العامل</th><th>الحالة</th><th>وقت الدخول</th><th>ساعات اليوم</th><th>آخر موقع</th><th>صورة</th></tr>${rows.map(r=>`<tr><td><b>${esc(r.w.name)}</b><br><span class="mut">${esc(r.w.addr)}</span></td><td>${r.last?`<span class="b ${r.last.type=='in'?'in':'o'}">${r.last.type=='in'?'داخل':'خرج'}</span>`:'<span class="b o">لم يسجل</span>'}</td><td>${r.first?tm(r.first.t):'—'}</td><td>${H(r.h)}</td><td>${r.last?locCell(r.last):'—'}</td><td>${r.last?.photo?`<img class="th" src="${r.last.photo}">`:'—'}</td></tr>`).join('')||'<tr><td colspan="6" class="mut">أضف العمال أولاً</td></tr>'}</table></div>`}
function tWorkers(e){const w=e||{};$('#tb').innerHTML=`<div class="card"><h3 style="margin-top:0">${w.id?'تعديل عامل':'إضافة عامل'}</h3><div class="f"><div><label>الاسم</label><input id="wn" value="${esc(w.name)}"></div><div><label>رقم التليفون</label><input id="wp" value="${esc(w.phone)}"></div><div><label>العنوان (السكن)</label><input id="wa" value="${esc(w.addr)}"></div><div><label>المرتب (جنيه)</label><input id="wm" type="number" value="${esc(w.pay)}"></div><div><label>نوع المرتب</label><select id="wt"><option value="week" ${w.per=='week'?'selected':''}>أسبوعي</option><option value="month" ${w.per=='month'?'selected':''}>شهري</option></select></div><div><label>كود سري للعامل</label><input id="wc" value="${esc(w.code)}"></div></div><p><button data-a="saveW" data-id="${w.id||''}">حفظ</button></p></div><div class="card tw"><table><tr><th>الاسم</th><th>التليفون</th><th>العنوان</th><th>المرتب</th><th>البصمة</th><th></th></tr>${D.workers.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.phone)}</td><td>${esc(x.addr)}</td><td>${esc(x.pay)} / ${x.per=='week'?'أسبوع':'شهر'}</td><td>${x.cred?'<span class="b in">مسجلة</span>':'<span class="b o">لا</span>'} <button class="sm s" data-a="reg" data-id="${x.id}">تسجيل بصمة</button></td><td><button class="sm s" data-a="editW" data-id="${x.id}">تعديل</button> <button class="sm d" data-a="delW" data-id="${x.id}">حذف</button></td></tr>`).join('')||'<tr><td colspan="6" class="mut">لا يوجد عمال</td></tr>'}</table><p class="mut">تسجيل البصمة يتم على نفس الجهاز الذي سيستخدمه العامل، وبحضور العامل.</p></div>`}
function tReports(){const sel=$('#rp')?.value||'week',wf=$('#rw')?.value||'';const s=startOf(sel),L=D.logs.filter(l=>l.t>=s&&(!wf||l.wid==wf)).sort((a,b)=>b.t-a.t),nm=id=>esc(D.workers.find(w=>w.id==id)?.name||'—');
 $('#tb').innerHTML=`<div class="card"><div class="f"><div><label>الفترة</label><select id="rp" data-a="rep"><option value="day">اليوم</option><option value="week">الأسبوع</option><option value="month">الشهر</option></select></div><div><label>العامل</label><select id="rw" data-a="rep"><option value="">الكل</option>${D.workers.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div><div><button data-a="csv">تصدير Excel (CSV)</button></div></div></div><div class="card tw"><table><tr><th>العامل</th><th>ساعات الفترة</th><th>المرتب</th></tr>${D.workers.filter(w=>!wf||w.id==wf).map(w=>`<tr><td>${esc(w.name)}</td><td>${H(hrs(w.id,s))}</td><td>${esc(w.pay)} / ${w.per=='week'?'أسبوع':'شهر'}</td></tr>`).join('')}</table></div><div class="card tw"><table><tr><th>العامل</th><th>النوع</th><th>التاريخ</th><th>الوقت</th><th>الموقع</th></tr>${L.map(l=>`<tr><td>${nm(l.wid)}</td><td><span class="b ${l.type=='in'?'in':'o'}">${l.type=='in'?'دخول':'انصراف'}</span></td><td>${dd(l.t)}</td><td>${tm(l.t)}</td><td>${locCell(l)}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">لا توجد سجلات</td></tr>'}</table></div>`;$('#rp').value=sel;$('#rw').value=wf}
function tSet(){const c=D.cfg;$('#tb').innerHTML=`<div class="card"><h3 style="margin-top:0">موقع المصنع</h3><p class="mut">يُستخدم لمعرفة هل العامل سجّل من داخل المصنع أم خارجه.</p><div class="f"><div><label>النطاق المسموح (متر)</label><input id="sr" type="number" value="${c.r}"></div><div><button data-a="setLoc">تحديد موقعي الحالي كموقع المصنع</button></div></div><p class="mut" id="sl">${c.lat!=null?`الموقع الحالي المحفوظ: ${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}`:'لم يتم تحديد الموقع بعد'}</p></div><div class="card"><h3 style="margin-top:0">الرقم السري للمدير</h3><div class="f"><div><input id="sp" type="password" placeholder="رقم سري جديد"></div><div><button data-a="setPin">تغيير</button></div></div></div><div class="card"><h3 style="margin-top:0">البيانات</h3><button class="s" data-a="bak">نسخة احتياطية JSON</button> <button class="d" data-a="wipe">مسح كل السجلات</button><p class="mut">البيانات محفوظة على هذا الجهاز فقط (نسخة تجريبية).</p></div>`}
async function dl(name,txt,type){try{const d=await claude.use('downloads');if(d){await d.save({filename:name,data:new Blob(['\ufeff'+txt],{type})});return}}catch(e){}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+txt],{type}));a.download=name;a.click()}
const A={home,worker,admin,punch:d=>punch(d.t),
 login:()=>{if($('#pn').value==D.cfg.pin){adm=true;admin()}else $('#pe').textContent='رقم سري غير صحيح'},
 tab:d=>{tab=d.v;admin()},rep:()=>tReports(),
 saveW:d=>{const o={name:$('#wn').value.trim(),phone:$('#wp').value,addr:$('#wa').value,pay:$('#wm').value,per:$('#wt').value,code:$('#wc').value};if(!o.name)return;if(d.id)Object.assign(D.workers.find(w=>w.id==d.id),o);else D.workers.push({id:Date.now(),...o});save();tWorkers()},
 editW:d=>tWorkers(D.workers.find(w=>w.id==d.id)),delW:d=>{D.workers=D.workers.filter(w=>w.id!=d.id);save();tWorkers()},
 reg:async d=>{const w=D.workers.find(x=>x.id==d.id);try{const c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'Gawhara Shoes'},user:{id:rnd(16),name:w.name,displayName:w.name},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});w.cred=b64(c.rawId);save();tWorkers()}catch(e){alert('تعذر تسجيل البصمة على هذا الجهاز/المتصفح. يمكن للعامل استخدام الكود السري.')}},
 setLoc:async()=>{const p=await getPos();if(!p){alert('فعّل إذن الموقع ثم حاول مرة أخرى');return}D.cfg.lat=p.lat;D.cfg.lng=p.lng;D.cfg.r=+$('#sr').value||300;save();tSet()},
 setPin:()=>{const v=$('#sp').value;if(v.length>=4){D.cfg.pin=v;save();$('#sp').value='';alert('تم تغيير الرقم السري')}else alert('4 أرقام على الأقل')},
 csv:()=>{const nm=id=>D.workers.find(w=>w.id==id)?.name||'';const r=[['العامل','النوع','التاريخ','الوقت','خط العرض','خط الطول','الدقة','رابط الخريطة']].concat(D.logs.map(l=>[nm(l.wid),l.type=='in'?'دخول':'انصراف',dd(l.t),tm(l.t),l.lat??'',l.lng??'',Math.round(l.acc),l.lat!=null?map(l):'']));dl('attendance.csv',r.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')},
 bak:()=>dl('gawhara-backup.json',JSON.stringify(D),'application/json'),
 wipe:(d,b)=>{if(d.armed){D.logs=[];save();tSet()}else{b.dataset.armed=1;b.textContent='اضغط مرة أخرى للتأكيد'}}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&b.tagName!='SELECT')A[b.dataset.a](b.dataset,b)});
document.addEventListener('change',e=>{if(e.target.dataset.a=='rep')A.rep()});
home();
</script></body></html>
